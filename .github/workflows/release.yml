name: Release

# Publishes to npm when a GitHub Release is published. The same gates as CI run
# first — a release must never ship something CI would have rejected.
#
# Requires an `NPM_TOKEN` repository secret with publish rights on the
# @luxorlabs scope. `publishConfig.access=public` in package.json handles the
# scoped-package default (scoped packages are private unless told otherwise).
on:
  release:
    types: [published]
  # Manual re-run, e.g. when a publish failed after the release was cut.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run validate:package

      # Fail loud when the tag and package.json disagree, rather than
      # publishing a version nobody asked for.
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          tag="${{ github.event.release.tag_name }}"
          if [ "$pkg" != "$tag" ]; then
            echo "release tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
